<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CesiumJS 3D gloobus - Kool ja kodu</title>

<script src="https://cdn.tailwindcss.com"></script>

<!-- CesiumJS 1.145.0 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Widgets/widgets.css">
<script src="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Cesium.js"></script>
</head>
<body class="h-screen flex flex-col bg-slate-50 text-slate-800">

<!-- Navigatsioon -->
<nav class="bg-slate-800 text-slate-300">
  <div class="mx-auto max-w-5xl flex flex-wrap items-center gap-1 px-4 py-2">
    <a href="../index.html" class="mr-auto font-semibold text-white">Kool ja kodu kaardil</a>
    <a href="../index.html" class="rounded px-3 py-1.5 text-sm hover:bg-slate-700 hover:text-white">Avaleht</a>
    <a href="../leaflet/kaart.html" class="rounded px-3 py-1.5 text-sm hover:bg-slate-700 hover:text-white">LeafletJS kaart</a>
    <a href="../openlayers/kaart.html" class="rounded px-3 py-1.5 text-sm hover:bg-slate-700 hover:text-white">OpenLayers kaart</a>
    <a href="../cesium/kaart.html" class="rounded px-3 py-1.5 text-sm bg-slate-700 text-white">CesiumJS 3D</a>
    <a href="../vordlus.html" class="rounded px-3 py-1.5 text-sm hover:bg-slate-700 hover:text-white">Töö kirjeldus</a>
  </div>
</nav>

<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto max-w-5xl flex flex-wrap items-center gap-2 px-4 py-3">
    <h1 class="mr-auto text-lg font-semibold text-slate-900">Kaart 3 &middot; CesiumJS 3D gloobus</h1>
    <!-- LISAFUNKTSIOON 2: kaamera lennud -->
    <button data-lenda="Kool" class="rounded bg-blue-600 px-3 py-1 text-sm text-white hover:bg-blue-700">Lenda kooli</button>
    <button data-lenda="Kodu" class="rounded bg-red-600 px-3 py-1 text-sm text-white hover:bg-red-700">Lenda koju</button>
    <button data-lenda="koik" class="rounded bg-slate-600 px-3 py-1 text-sm text-white hover:bg-slate-700">Kogu teekond</button>
  </div>
</header>

<!-- Gloobus taidab ekraanist ulejaanu osa -->
<div class="relative flex-1">
  <div id="map" class="absolute inset-0"></div>

  <!-- LISAFUNKTSIOON 3: aluskaardi valik -->
  <div class="absolute left-2 top-2 z-10 rounded-md bg-white px-3 py-2 text-sm shadow-md">
    <label for="aluskaart" class="mr-1 text-slate-600">Aluskaart:</label>
    <select id="aluskaart" class="rounded border border-slate-300 px-1 py-0.5">
      <option value="osm">Tavakaart</option>
      <option value="sat">Satelliit</option>
    </select>
  </div>

  <!-- LISAFUNKTSIOON 1: teekonna pikkus -->
  <div id="info" class="absolute bottom-8 left-2 z-10 rounded-md bg-white px-3 py-2 text-sm shadow-md">
    KML-faili laadimine...
  </div>
</div>

<script>
// --- Aluskaardid -------------------------------------------------------
// Cesiumi vaikimisi aluskaart vajab Cesium ion'i votit. Votit pole vaja,
// kui kasutada OpenStreetMapi ja Esri pilte otse.

var tavakaart = new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({
  url: 'https://tile.openstreetmap.org/',
  maximumLevel: 19
}));

var satelliit = new Cesium.ImageryLayer(new Cesium.UrlTemplateImageryProvider({
  url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  credit: 'Tiles &copy; Esri',
  maximumLevel: 19
}));


// --- Gloobus -----------------------------------------------------------

var viewer = new Cesium.Viewer('map', {
  baseLayer: tavakaart,
  baseLayerPicker: false,   // ion'i kihid, ei kasuta
  geocoder: false,          // vajab ion'i votit
  timeline: false,
  animation: false,
  homeButton: false,
  navigationHelpButton: false,
  sceneModePicker: true     // 3D / 2D / 2,5D vahetus on Cesiumis olemas
});

document.getElementById('aluskaart').addEventListener('change', function () {
  var sat = this.value === 'sat';
  var kihid = viewer.imageryLayers;
  if (sat && !kihid.contains(satelliit)) kihid.add(satelliit);
  satelliit.show = sat;
  tavakaart.show = !sat;
});


// --- KML-faili lugemine ------------------------------------------------
// Cesiumil on KML-i jaoks valmis lugeja Cesium.KmlDataSource, mis loeb ka
// Google Earthi laiendused (gx:). NB! fail loetakse fetch'iga, seega ava
// leht kohaliku serveri kaudu (nt VS Code Live Server).

var teekond = null;       // joon, mille pikkus arvutatakse
var punktid = {};         // nimi -> olem (Kool, Kodu)

Cesium.KmlDataSource.load('../andmed/kaart.kml', {
  camera: viewer.scene.camera,
  canvas: viewer.scene.canvas,
  clampToGround: true
}).then(function (andmed) {
  viewer.dataSources.add(andmed);

  andmed.entities.values.forEach(function (olem) {
    var nimi = olem.name || '';

    // Punktid: Kool ja Kodu on failis kaks korda, jatame esimese.
    // heightReference'it ei kasuta: maastikku pole ja 2D / 2,5D vaates
    // kaoksid maapinnale kinnitatud punktid ara.
    if (olem.position && olem.billboard) {
      if (punktid[nimi]) { olem.show = false; return; }
      punktid[nimi] = olem;
      olem.billboard = undefined;
      olem.point = {
        pixelSize: 14,
        color: Cesium.Color.fromCssColorString(nimi === 'Kool' ? '#1976d2' : '#d32f2f'),
        outlineColor: Cesium.Color.WHITE,
        outlineWidth: 2,
        disableDepthTestDistance: Number.POSITIVE_INFINITY
      };
      olem.label = {
        text: nimi,
        font: 'bold 14px Arial',
        fillColor: Cesium.Color.fromCssColorString('#222'),
        outlineColor: Cesium.Color.WHITE,
        outlineWidth: 3,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        pixelOffset: new Cesium.Cartesian2(0, -22),
        disableDepthTestDistance: Number.POSITIVE_INFINITY
      };
    }

    // Teekond kodust kooli.
    if (olem.polyline) {
      teekond = olem;
      olem.polyline.width = 5;
      olem.polyline.material = Cesium.Color.fromCssColorString('#ff6712');
    }

    // Kodukohta tahistav kujund: tostame 3D majaks (12 m korgune).
    if (olem.polygon) {
      olem.polygon.material = Cesium.Color.fromCssColorString('#fbc02d').withAlpha(0.7);
      olem.polygon.extrudedHeight = 12;
      olem.polygon.outline = true;
      olem.polygon.outlineColor = Cesium.Color.fromCssColorString('#f57f17');
    }
  });

  naitaPikkust();
  return viewer.flyTo(andmed, { duration: 0 });
}).catch(function (viga) {
  document.getElementById('info').textContent =
    'KML-faili ei saanud lugeda. Ava leht kohaliku serveri kaudu.';
  console.error(viga);
});


// --- Teekonna pikkus ---------------------------------------------------
// Cesium.EllipsoidGeodesic arvutab kahe punkti vahemaa maakera pinnal.

function naitaPikkust() {
  if (!teekond) return;
  var asukohad = teekond.polyline.positions.getValue(Cesium.JulianDate.now());
  var meetrid = 0;
  for (var i = 1; i < asukohad.length; i++) {
    var geodeesia = new Cesium.EllipsoidGeodesic(
      Cesium.Cartographic.fromCartesian(asukohad[i - 1]),
      Cesium.Cartographic.fromCartesian(asukohad[i])
    );
    meetrid += geodeesia.surfaceDistance;
  }
  var km = (meetrid / 1000).toFixed(2).replace('.', ',');
  var minutid = Math.round(meetrid / 1000 / 5 * 60);   // 5 km/h
  document.getElementById('info').innerHTML =
    '<b>Teekond kodust kooli:</b> ' + km + ' km &middot; jalgsi ~' + minutid + ' min';
}


// --- Kaamera lennud ----------------------------------------------------
// 3D vaates vaatab kaamera punkti poole viltu, et maja oleks 3D-s naha.
// 2D ja 2,5D vaates kaamerat kallutada ei saa, seal lendame otse ule.

// Ristkulik ule teekonna koos varuga, sobib koigi vaadete jaoks.
function teekonnaAla() {
  var ala = Cesium.Rectangle.fromCartesianArray(
    teekond.polyline.positions.getValue(Cesium.JulianDate.now()));
  var varu = Math.max(ala.width, ala.height) * 0.3;
  return new Cesium.Rectangle(ala.west - varu, ala.south - varu, ala.east + varu, ala.north + varu);
}

document.querySelectorAll('[data-lenda]').forEach(function (nupp) {
  nupp.addEventListener('click', function () {
    var siht = nupp.dataset.lenda;
    if (siht === 'koik') {
      viewer.camera.flyTo({ duration: 2, destination: teekonnaAla() });
      return;
    }
    var olem = punktid[siht];
    if (!olem) return;

    if (viewer.scene.mode === Cesium.SceneMode.SCENE3D) {
      viewer.flyTo(olem, {
        duration: 2,
        offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-35), 400)
      });
    } else {
      var koht = Cesium.Cartographic.fromCartesian(olem.position.getValue(Cesium.JulianDate.now()));
      viewer.camera.flyTo({
        duration: 2,
        destination: Cesium.Cartesian3.fromRadians(koht.longitude, koht.latitude, 800)
      });
    }
  });
});
</script>

</body>
</html>
